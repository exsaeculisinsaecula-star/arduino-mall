<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArduinoMall - 아두이노 쇼핑몰</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Arduino<span>Mall</span></a>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="상품을 검색하세요...">
        <button onclick="handleSearch()">검색</button>
      </div>
      <nav class="nav">
        <a href="index.html">홈</a>
        <a href="pages/cart.html" class="cart-link">
          장바구니
          <span class="cart-count" id="cart-count">0</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h1>아두이노 프로젝트의 시작</h1>
    <p>보드, 센서, 모듈, 키트까지 — 필요한 모든 것을 한번에</p>
  </section>

  <!-- Category Filter -->
  <div class="category-filter" id="category-filter">
    <button class="category-btn active" onclick="filterCategory('all', this)">전체</button>
    <button class="category-btn" onclick="filterCategory('board', this)">보드</button>
    <button class="category-btn" onclick="filterCategory('sensor', this)">센서</button>
    <button class="category-btn" onclick="filterCategory('module', this)">모듈</button>
    <button class="category-btn" onclick="filterCategory('kit', this)">키트</button>
  </div>

  <!-- Products -->
  <h2 class="section-title">상품 목록</h2>
  <div class="product-grid" id="product-grid"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div>
        <h3>ArduinoMall</h3>
        <p>아두이노 & IoT 프로젝트를 위한<br>전문 부품 쇼핑몰입니다.</p>
      </div>
      <div>
        <h3>고객센터</h3>
        <p>문의: 02-1234-5678<br>이메일: help@arduinomall.kr<br>평일 09:00 ~ 18:00</p>
      </div>
      <div>
        <h3>정보</h3>
        <p>사업자등록번호: 123-45-67890<br>통신판매업신고: 제2024-서울-0001호<br>대표: 홍길동</p>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; 2026 ArduinoMall. All rights reserved.
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // 초기화
    (async function() {
      await loadProducts();
      renderProducts(allProducts);
      updateCartCount();

      // 엔터키 검색
      document.getElementById('search-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleSearch();
      });
    })();

    function filterCategory(category, btn) {
      // 버튼 active 토글
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const filtered = filterByCategory(category);
      renderProducts(filtered);
    }

    function handleSearch() {
      const keyword = document.getElementById('search-input').value.trim();
      if (keyword === '') {
        renderProducts(allProducts);
      } else {
        renderProducts(searchProducts(keyword));
      }
    }
  </script>
</body>
</html>
